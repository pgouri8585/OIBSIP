<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="converter">

            <h1>Temperature Converter</h1>

            <p class="subtitle">
                Convert temperature easily between Celsius, Fahrenheit and Kelvin.
            </p>

            <!-- Temperature Input -->
            <label for="temperature">Enter Temperature</label>

            <input
                type="number"
                id="temperature"
                placeholder="Enter value"
            >

            <!-- Unit Selection -->
            <label for="unit">Select Input Unit</label>

            <select id="unit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <!-- Convert Button -->
            <button onclick="convertTemperature()">
                Convert
            </button>

            <!-- Error Message -->
            <p id="error"></p>

            <!-- Result -->
            <div class="result" id="result">

                <h2>Result</h2>

                <p id="celsius">Celsius: --</p>

                <p id="fahrenheit">Fahrenheit: --</p>

                <p id="kelvin">Kelvin: --</p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
